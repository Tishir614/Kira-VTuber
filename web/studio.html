<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kira Studio</title>
<style>body{margin:0;background:#0a0710;color:#eee;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#15101d;border:1px solid #352743;border-radius:20px;padding:20px}h1{font-size:32px}label{display:block;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #4b385c;background:#0d0912;color:#fff}input[type=range]{padding:0}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{padding:11px 15px;border:0;border-radius:12px;cursor:pointer}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#282032;margin:3px}.ok{background:#183824}.bad{background:#482020}small{opacity:.65}</style></head>
<body><div class="wrap"><h1>Kira Studio 🎛️</h1><p id="health">Проверяю ядро…</p><div class="grid">
<section class="card"><h2>Ядро</h2><div id="core"></div><label>Wake word</label><input id="wake" value="кира"><div class="buttons" style="margin-top:14px"><button onclick="hands(true)">▶ Hands-free</button><button onclick="hands(false)">■ Стоп</button></div></section>
<section class="card"><h2>Характер</h2><label>Теплота <span id="warmthV"></span></label><input id="warmth" type="range" min="0" max="1" step=".05"><label>Юмор</label><input id="humor" type="range" min="0" max="1" step=".05"><label>Энергия</label><input id="energy" type="range" min="0" max="1" step=".05"><label>Подробность</label><input id="verbosity" type="range" min="0" max="1" step=".05"><button onclick="save()">Сохранить</button></section>
<section class="card"><h2>Память</h2><div id="memory">…</div><div class="buttons"><button onclick="location.href='/'">💬 Чат</button><button onclick="clearMemory()">Очистить память</button></div></section>
<section class="card"><h2>🎙️ Голос / OBS</h2><label>Голос Piper</label><select id="voiceModel"></select><label>Аудиовыход OBS</label><select id="audioOut"></select><label>Скорость речи <span id="speedV">1.00</span></label><input id="voiceSpeed" type="range" min=".5" max="2" step=".05" value="1"><div class="buttons"><button onclick="saveVoice()">💾 Сохранить</button><button onclick="test('/selftest/voice','Голос')">▶ Тест голоса</button><button onclick="window.open('/overlay','_blank')">📺 OBS Overlay</button></div></section><section class="card"><h2>Диагностика</h2><div id="diag">…</div><div class="buttons"><button onclick="test('/selftest/microphone','Микрофон')">🎤 Микрофон</button><button onclick="test('/selftest/stt','STT')">📝 STT</button><button onclick="test('/selftest/voice','Голос')">🔊 Голос</button><button onclick="load()">↻</button></div><p id="testout"></p></section><section class="card"><h2>Стрим</h2><div id="twitch">Twitch: проверка…</div><label>Twitch Client ID</label><input id="tcid"><label>Client Secret</label><input id="tsecret" type="password"><div class="buttons"><button onclick="connectTwitch()">🟣 Подключить Twitch</button><button onclick="disconnectTwitch()">Отключить</button></div><small>Секрет сохраняется только локально в runtime/settings.json и не отправляется в Git.</small></section><section class="card"><h2>Live2D</h2><div id="avatar">Ожидание модели</div><small>После экспорта .model3.json/.moc3 здесь появится реальный превью-рендер.</small></section>
</div></div><script>
const $=id=>document.getElementById(id);
async function j(url,opt){let r=await fetch(url,opt);return r.json()}
async function load(){let h=await j('/health');$('health').innerHTML='<span class="pill '+(h.ollama?'ok':'bad')+'">Ollama '+(h.ollama?'online':'offline')+'</span><span class="pill">'+h.model+'</span>';
let s=await j('/settings');$('wake').value=s.wake_word;$('voiceSpeed').value=s.voice_speed||1;$('speedV').textContent=(+(s.voice_speed||1)).toFixed(2);let vc=await j('/voices');$('voiceModel').innerHTML='<option value="">По умолчанию</option>'+vc.voices.map(v=>'<option value="'+v.path+'">'+v.name+'</option>').join('');$('voiceModel').value=s.piper_model||vc.active||'';let ad=await j('/devices/audio');let ds=(ad.devices&&ad.devices.outputs)||ad.devices||[];$('audioOut').innerHTML='<option value="">Системный выход</option>'+ds.map(x=>{let v=typeof x==='string'?x:(x.name||x.id||JSON.stringify(x));return '<option value="'+v+'">'+v+'</option>'}).join('');$('audioOut').value=s.audio_output||'';for(let k of ['warmth','humor','energy','verbosity'])$(k).value=s.personality[k];
let d=await j('/diagnostics');$('diag').innerHTML=Object.entries(d).map(([k,v])=>'<span class="pill '+(v===true?'ok':v===false?'bad':'')+'">'+k+': '+v+'</span>').join('');let tw=await j('/auth/twitch/status');$('twitch').textContent='Twitch: '+(tw.connected?'✓ '+(tw.user||'подключён'):'не подключён');let m=await j('/memory');$('memory').textContent=(m.facts||[]).length+' сохранённых фактов';let a=await j('/avatar/state');$('avatar').textContent='Эмоция: '+a.emotion+' • рот: '+a.mouth_open.toFixed(2);}
async function save(){let personality={};for(let k of ['warmth','humor','energy','verbosity'])personality[k]=+$ (k).value;await j('/settings',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({wake_word:$('wake').value,personality})});load()}
async function saveVoice(){await j('/settings',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({piper_model:$('voiceModel').value,audio_output:$('audioOut').value,voice_speed:+$('voiceSpeed').value})});load()}$('voiceSpeed').oninput=()=>$('speedV').textContent=(+$('voiceSpeed').value).toFixed(2);async function hands(on){await j('/handsfree/'+(on?'start':'stop'),{method:'POST',headers:{'content-type':'application/json'},body:on?JSON.stringify({wake_word:$('wake').value}):null});load()}
async function connectTwitch(){let d=await j('/auth/twitch/url',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_id:$('tcid').value,client_secret:$('tsecret').value})});if(d.url)window.open(d.url,'_blank')}async function disconnectTwitch(){await fetch('/auth/twitch',{method:'DELETE'});load()}async function test(url,name){$('testout').textContent=name+': выполняется…';try{let r=await fetch(url,{method:'POST'}),d=await r.json();$('testout').textContent=name+': '+(r.ok?'✓ ':'✗ ')+(d.text||d.detail||'готово')}catch(e){$('testout').textContent=name+': ✗ '+e}}async function clearMemory(){if(confirm('Очистить локальную память Киры?')){await j('/memory',{method:'DELETE'});load()}}
load();setInterval(async()=>{try{let a=await j('/avatar/state');$('avatar').textContent='Эмоция: '+a.emotion+' • рот: '+a.mouth_open.toFixed(2)+(a.listening?' • слушает':'')+(a.speaking?' • говорит':'')}catch{}},500);
</script></body></html>
