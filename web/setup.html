<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kira Setup</title>
<style>body{margin:0;background:#09070d;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(700px,90vw);background:#17101f;padding:28px;border:1px solid #3a2949;border-radius:24px}button{padding:12px 18px;border:0;border-radius:12px;cursor:pointer;margin:5px}code{background:#0c0910;padding:4px 7px;border-radius:7px}.item{padding:10px;margin:7px 0;background:#21182a;border-radius:12px}.good{outline:1px solid #315d3a}.bad{outline:1px solid #6c3434}</style></head><body><main class=box><h1>Добро пожаловать в Kira 💜</h1><p>Мастер проверит компьютер и подготовит локальное AI-ядро.</p><div id=info>Сканирую железо…</div><div id=actions></div><p id=status></p><button onclick="location.href='/studio'">Открыть Kira Studio →</button></main>
<script>const I=document.querySelector('#info'),A=document.querySelector('#actions'),S=document.querySelector('#status');async function load(){let d=await(await fetch('/setup/status')).json(),h=d.hardware;I.innerHTML='<div class=item>CPU: '+h.cpu+'</div><div class=item>RAM: '+h.ram_gb+' GB</div><div class=item>GPU: '+h.gpu+'</div><div class=item>Рекомендуемая LLM: <code>'+d.recommended_model+'</code></div>'+Object.entries(d.tools).map(([k,v])=>'<div class="item '+(v?'good':'bad')+'">'+k+': '+(v?'готов':'не найден')+'</div>').join('');A.innerHTML=d.tools.ollama?'<button onclick="pull(\''+d.recommended_model+'\')">Скачать '+d.recommended_model+'</button>':''}async function pull(m){S.textContent='Скачиваю '+m+'… это может занять время.';let r=await fetch('/setup/pull-model',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:m})});let d=await r.json();S.textContent=r.ok?'Модель готова ✓':(d.detail||'Ошибка')}load()</script></body></html>
