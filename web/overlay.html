<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui;color:white}
#wrap{position:absolute;left:4%;right:4%;bottom:5%;text-align:center}#name{font-weight:800;font-size:28px;text-shadow:0 2px 8px #000}
#sub{display:inline-block;margin-top:8px;padding:10px 18px;border-radius:16px;background:#0009;font-size:24px;max-width:85%;text-shadow:0 2px 6px #000}
</style></head><body><div id=wrap><div id=name>KIRA</div><div id=sub>Запуск…</div></div><script>
let last='';async function tick(){try{let r=await fetch('/overlay/state'),d=await r.json();document.querySelector('#sub').textContent=d.subtitle||'';document.querySelector('#sub').style.display=d.show_subtitles&&d.subtitle?'inline-block':'none'}catch{}}setInterval(tick,250);tick()
</script></body></html>
