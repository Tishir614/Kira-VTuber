services:
  kira-desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-kde
    container_name: kira-cloud-desktop
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - TITLE=Kira Cloud
    volumes:
      - kira_home:/config
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    shm_size: "2gb"
    restart: unless-stopped
  kira-agent:
    build:
      context: ..
      dockerfile: cloud/agent/Dockerfile
    container_name: kira-cloud-agent
    environment:
      - KIRA_GAME_ALLOWLIST=${KIRA_GAME_ALLOWLIST:-}
    network_mode: "service:kira-desktop"
    depends_on:
      - kira-desktop
    restart: unless-stopped
volumes:
  kira_home:
