name: Kira Core Smoke Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['kira/**','web/**','tests/**','requirements*.txt','.github/workflows/core-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q kira
      - run: python -c "import kira.main; print('Kira Core import OK')"
      - run: pytest -q tests/test_smoke.py
